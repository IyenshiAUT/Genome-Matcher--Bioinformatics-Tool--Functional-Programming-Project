<!DOCTYPE html>
<html>
<head>
    <title>Reference Upload Test</title>
</head>
<body>
    <h1>Reference File Test</h1>
    <p>Reference File:</p>
    <input type='file' id='reference' accept='.txt' onchange='readFile(this, "refContent")'>
    <textarea id='refContent' placeholder='Reference DNA content will appear here...' style='width: 100%; height: 100px; margin-top: 10px;'></textarea>
    
    <script>
    function readFile(input, targetId) {
        console.log('readFile called with targetId:', targetId);
        const file = input.files[0];
        if (file) {
            console.log('Reading reference file:', file.name);
            const reader = new FileReader();
            reader.onload = function(e) {
                console.log('Reference file loaded, content length:', e.target.result.length);
                document.getElementById(targetId).value = e.target.result;
                console.log('Reference content set in textarea');
            };
            reader.readAsText(file);
        } else {
            console.log('No file selected for reference');
        }
    }
    </script>
</body>
</html>
