name: genome-matcher
version: 0.1.0.0
github: "IyenshiAUT/Genome-Matcher--Bioinformatics-Tool--Functional-Programming-Project"
license: BSD3
author: "Your Name"
maintainer: "you@example.com"
copyright: "2025 Your Name"

extra-source-files:
- README.md

description: Bioinformatics DNA Analysis Tool using Functional Programming

dependencies:
- base >= 4.7 && < 5
- aeson
- scotty
- text
- wai
- wai-cors
- wai-extra
- deepseq
- bytestring
- unordered-containers
- vector
- parallel
- async

ghc-options:
- -Wall
- -Wcompat
- -Widentities
- -Wincomplete-record-updates
- -Wincomplete-uni-patterns
- -Wmissing-export-lists
- -Wmissing-home-modules
- -Wpartial-fields
- -Wredundant-constraints

executables:
  genome-matcher-exe:
    main: Main.hs
    source-dirs: .
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
