<!DOCTYPE html>
<html>
<head>
    <title>Test DNA Upload</title>
</head>
<body>
    <h1>Test DNA Upload</h1>
    <form action="http://localhost:3000/analyze" method="post" enctype="multipart/form-data">
        <p>Reference File:</p>
        <input type="file" name="reference" required>
        <br><br>
        <p>Patient Files:</p>
        <input type="file" name="patients" multiple required>
        <br><br>
        <button type="submit">Analyze</button>
    </form>
    
    <script>
    // Let's also test via JavaScript
    function testAnalysis() {
        const formData = new FormData();
        
        // Create simple text files
        const refBlob = new Blob(['ATCGATCGATCGATCG'], { type: 'text/plain' });
        const patientBlob = new Blob(['ATCGATCGATCGATCG'], { type: 'text/plain' });
        
        formData.append('reference', refBlob, 'reference.txt');
        formData.append('patients', patientBlob, 'patient1.txt');
        
        fetch('http://localhost:3000/analyze', {
            method: 'POST',
            body: formData
        }).then(response => {
            console.log('Status:', response.status);
            return response.text();
        }).then(data => {
            console.log('Response:', data);
            document.getElementById('result').innerHTML = data;
        }).catch(error => {
            console.error('Error:', error);
            document.getElementById('result').innerHTML = 'Error: ' + error;
        });
    }
    </script>
    
    <br><br>
    <button onclick="testAnalysis()">Test via JavaScript</button>
    <div id="result"></div>
</body>
</html>
