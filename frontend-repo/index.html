<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Genome Matcher - DNA Analysis Tool</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="logo">
                <div class="dna-icon">🧬</div>
                <h1>Genome Matcher</h1>
            </div>
            <p class="subtitle">Bioinformatics DNA Analysis Tool</p>
        </header>

        <main class="main">
            <div class="upload-section">
                <h2>Upload DNA Sequences</h2>
                <div class="upload-grid">
                    <div class="upload-card">
                        <h3>Reference Genome</h3>
                        <input type="file" id="reference-file" accept=".dna,.txt" class="file-input">
                        <label for="reference-file" class="upload-button">
                            <span>📄</span>
                            Choose Reference File
                        </label>
                        <div class="file-info" id="reference-info"></div>
                    </div>
                    
                    <div class="upload-card">
                        <h3>Patient Samples</h3>
                        <input type="file" id="patient-files" accept=".dna,.txt" multiple class="file-input">
                        <label for="patient-files" class="upload-button">
                            <span>📁</span>
                            Choose Patient Files
                        </label>
                        <div class="file-info" id="patient-info"></div>
                    </div>
                </div>
                
                <div class="demo-section">
                    <button id="load-demo" class="demo-button">
                        🔬 Load Demo Data
                    </button>
                    <p class="demo-text">Or use our sample DNA sequences for testing</p>
                </div>
            </div>

            <div class="analysis-section">
                <button id="analyze-btn" class="analyze-button" disabled>
                    <span class="spinner" id="spinner"></span>
                    🔍 Analyze DNA Sequences
                </button>
            </div>

            <div class="results-section" id="results-section" style="display: none;">
                <h2>Analysis Results</h2>
                <div id="results-container"></div>
            </div>
        </main>

        <footer class="footer">
            <p>Functional Programming Project - Genome Matcher v1.0</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
