<!DOCTYPE html>
<html>
<head>
    <title>Genome Matcher Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ccc; }
        textarea { width: 100%; height: 80px; margin: 10px 0; }
        button { padding: 10px 20px; margin: 5px; }
        .result { margin-top: 20px; padding: 15px; background: #f5f5f5; }
    </style>
</head>
<body>
    <h1>Genome Matcher Test</h1>
    
    <div class="test-section">
        <h3>Reference DNA</h3>
        <textarea id="reference">ATGCGATCGATCGATCGTAGCTAGCTAGCAATCGATCGATCGATCGTAGCTAGCTAG</textarea>
    </div>
    
    <div class="test-section">
        <h3>Patient 1 DNA (with mutation)</h3>
        <textarea id="patient1">ATGCGATCGATCGATCGTAGCTACCTAGCAATCGATCGATCGATCGTAGCTAGCTAG</textarea>
    </div>
    
    <div class="test-section">
        <h3>Patient 2 DNA (with different mutation)</h3>
        <textarea id="patient2">ATGCGATCGATCGATCGTAGCTAGCTTGCAATCGATCGATCGATCGTAGCTAGCTAG</textarea>
    </div>
    
    <button onclick="testAnalysis()">Analyze All Patients</button>
    <button onclick="clearResults()">Clear Results</button>
    
    <div id="results" class="result"></div>
    
    <script>
    function testAnalysis() {
        const reference = document.getElementById('reference').value;
        const patient1 = document.getElementById('patient1').value;
        const patient2 = document.getElementById('patient2').value;
        
        const data = {
            reference: reference,
            patients: [
                { name: "Patient_1_Mutation", content: patient1 },
                { name: "Patient_2_Mutation", content: patient2 }
            ]
        };
        
        console.log('Sending data:', data);
        
        fetch('http://localhost:3000/analyze', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(data)
        })
        .then(response => {
            console.log('Response status:', response.status);
            return response.text();
        })
        .then(html => {
            console.log('Response received');
            document.getElementById('results').innerHTML = html;
        })
        .catch(error => {
            console.error('Error:', error);
            document.getElementById('results').innerHTML = '<p style="color: red;">Error: ' + error + '</p>';
        });
    }
    
    function clearResults() {
        document.getElementById('results').innerHTML = '';
    }
    </script>
</body>
</html>
